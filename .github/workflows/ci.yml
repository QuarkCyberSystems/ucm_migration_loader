name: CI

on:
  push:
    branches:
      - develop
      - version-16
  pull_request:
  # Nightly against the head of Frappe's version-16 and ucm's develop: a change in either that breaks the loader
  # fails here first
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ci-ucm-migration-loader-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a commit and bench to a release, as in linter.yml.
env:
  FRAPPE_BENCH_VERSION: 5.31.0
  # The Frappe major this branch supports, as pyproject.toml declares it.
  FRAPPE_BRANCH: version-16

jobs:
  # The tests that need no site: the sealed file, the set-based route's planning, the run's overview and metrics,
  # and ucm-push. They need Frappe to import, and neither a database nor ucm.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: Unit

    steps:
      - name: Clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip

      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y libmariadb-dev pkg-config
          pip install "frappe @ git+https://github.com/frappe/frappe.git@${FRAPPE_BRANCH}"
          pip install -e ".[test]"

      - name: Run the unit tests
        run: pytest -v

  # ucm's repository is private: cloning it takes UCM_CLONE_URL, a URL with a token that reads it. Without that
  # secret the tests cannot run, and Server is skipped with a warning rather than failed. Set it to run them again.
  clone-url:
    runs-on: ubuntu-latest
    name: UCM clone URL
    outputs:
      set: ${{ steps.check.outputs.set }}
    steps:
      - id: check
        env:
          UCM_CLONE_URL: ${{ secrets.UCM_CLONE_URL }}
        run: |
          if [ -n "${UCM_CLONE_URL}" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "set=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Tests skipped::The UCM_CLONE_URL secret is not set: ucm cannot be cloned, so the Server tests do not run."
          fi

  tests:
    needs: clone-url
    if: needs.clone-url.outputs.set == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: |
          # MariaDB's client where the package mirrors answer; else the runner's own MySQL client, which Frappe uses
          # where MariaDB's is missing (frappe.database.get_command): a mirror outage no longer stops the tests
          if ! (sudo apt-get update && sudo apt-get install -y mariadb-client); then
            command -v mysql
            echo "::warning::MariaDB client not installed (package mirrors unreachable): the runner's MySQL client is used"
          fi

      - name: Setup
        run: |
          pip install "frappe-bench==${FRAPPE_BENCH_VERSION}"
          bench init --frappe-branch "${FRAPPE_BRANCH}" --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app --branch develop ucm "${UCM_CLONE_URL}"
          bench get-app ucm_migration_loader $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app ucm
          bench --site test_site install-app ucm_migration_loader
          bench build --app ucm
        env:
          CI: 'Yes'
          # The loader writes ucm's tables directly: the nightly run on ucm's develop finds a change that breaks it
          UCM_CLONE_URL: ${{ secrets.UCM_CLONE_URL }}

      - name: Run Tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app ucm_migration_loader --coverage
        env:
          TYPE: server

      # On a push only: paths become relative to the repository, so the report can be read beside the commit.
      - name: Make the coverage paths relative
        if: github.event_name == 'push'
        working-directory: /home/runner/frappe-bench
        run: sed -i -E 's#<source>[^<]*</source>#<source>.</source>#' sites/coverage.xml

      - name: Publish the coverage report
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: /home/runner/frappe-bench/sites/coverage.xml
          if-no-files-found: error
